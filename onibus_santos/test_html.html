function ExibePontosLinha(lat, lng, conteudo, icon, init) {
	//PRECISO FAZER UM ARRAY DE PONTOS, COMO DOS VEICULOS

		shelter1 = new L.marker([lat, lng], {icon: icon});
		shelterMarkers.addLayer(shelter1);
		shelter1.bindPopup(conteudo);

	} else {
		map.on('zoomend', function() {
			if (map.getZoom() <16){
					map.removeLayer(shelterMarkers);
			}
			else {
					map.addLayer(shelterMarkers);
				}
		});
	}
}
